name: 发布安装包

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  verify-version:
    name: 校验版本号
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验标签与配置版本
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)

          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 v${package_version} 不一致"
            exit 1
          fi

          if [[ "${tauri_version}" != "${package_version}" || "${cargo_version}" != "${package_version}" ]]; then
            echo "package.json、tauri.conf.json 与 Cargo.toml 的版本号必须一致"
            exit 1
          fi

  publish:
    name: 构建 ${{ matrix.name }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            sparkle_arch: aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            sparkle_arch: x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 配置 macOS 签名凭据
        if: runner.os == 'macOS'
        id: mac_signing
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats empty credential variables as configured credentials.
          # Export only non-empty secrets so ad-hoc signing remains available.
          echo "has_cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!name}" ]]; then
              delimiter="SIGNING_$(openssl rand -hex 16)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
            fi
          done

      - name: 导入 Developer ID 证书
        if: steps.mac_signing.outputs.has_cert == 'true'
        id: certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: 准备 Sparkle 更新框架
        if: runner.os == 'macOS'
        id: sparkle
        env:
          IDENTITIES: ${{ steps.certificate.outputs.identities }}
        run: |
          if [[ -n "$IDENTITIES" ]]; then
            SIGNING_IDENTITY=$(jq -er '[.[] | select(.name | startswith("Developer ID Application:"))] | if length == 1 then .[0].hash else error("需要唯一的 Developer ID Application 证书") end' <<< "$IDENTITIES")
            export SIGNING_IDENTITY
          fi
          scripts/prepare-sparkle.sh "${{ matrix.sparkle_arch }}"

      - name: 读取版本发布说明
        id: release_notes
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            delimiter="RELEASE_NOTES_${GITHUB_RUN_ID}"
            printf 'body<<%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
            cat "$notes_file" >> "$GITHUB_OUTPUT"
            printf '\n%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RunProject ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.release_notes.outputs.body }}

            请在 Assets 中下载适合当前系统的安装包：

            - macOS Apple Silicon（M1 及以上）：`aarch64` DMG
            - macOS Intel：`x86_64` DMG
            - Windows 64 位：NSIS 安装程序
            - Linux 64 位：AppImage 或 DEB

            macOS 包默认使用 ad-hoc 签名；首次打开时如果出现安全提醒，请在“系统设置 → 隐私与安全性”中确认打开。
            配置 APPLE_CERTIFICATE、APPLE_CERTIFICATE_PASSWORD、APPLE_ID、APPLE_PASSWORD 和 APPLE_TEAM_ID secrets 后，macOS 包会自动使用 Developer ID 签名并进行公证。
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][ext]"
          args: ${{ matrix.args }} ${{ steps.sparkle.outputs.args }}

      - name: 签名并上传 Sparkle 更新源
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/publish-sparkle.sh "${{ matrix.sparkle_arch }}" "${{ matrix.target }}"

  release:
    name: 公开完整发布
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: 发布安装包与更新源
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
