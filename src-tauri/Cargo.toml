[package]
name = "runproject"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runproject_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
lazy_static = "1.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "=3.3.0", features = ["transport-streamable-http-server"] }
# Keep code generation aligned with the SDK's schema API.
rmcp-macros = "=3.3.0"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
